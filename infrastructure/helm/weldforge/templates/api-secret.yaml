apiVersion: v1
kind: Secret
metadata:
  name: sso-api-secret
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.api.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.api.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.mail.password }}
  SPRING_MAIL_HOST: {{ .Values.mail.host | quote }}
  SPRING_MAIL_PORT: {{ .Values.mail.port | quote }}
  SPRING_MAIL_USERNAME: {{ .Values.mail.username | quote }}
  SPRING_MAIL_PASSWORD: {{ .Values.mail.password | quote }}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
  APP_MAIL_FROM: {{ .Values.mail.from | quote }}
  {{- end }}
  APP_CORS_ALLOWED_ORIGINS: {{ .Values.cors.allowedOrigins | quote }}
