{{- if .Values.monitoring.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sso-alerts
  namespace: {{ .Values.global.namespace }}
  labels:
    app: sso-api
    release: prometheus
spec:
  groups:
    - name: weldforge
      rules:
        - alert: HighLoginFailureRate
          expr: |
            sum(rate(sso_auth_login_total{outcome="failure"}[5m])) /
            (sum(rate(sso_auth_login_total[5m])) > 0) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Login failure rate exceeds 50%"

        - alert: LoginFailureSpike
          expr: sum(rate(sso_auth_login_total{outcome="failure"}[5m])) > 10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Login failure rate exceeds 10/sec"

        - alert: HighHeapUsage
          expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "JVM heap usage above 90%"

        - alert: HighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) /
            sum(rate(http_server_requests_seconds_count[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HTTP 5xx error rate above 5%"

        # Email delivery (sso.mail.send counter). A delivery failure is logged
        # but the triggering security op (password reset / email verification /
        # tenant identity-proofing) still returns success to the caller — so this
        # counter is the ONLY signal that account recovery is silently broken.
        - alert: MailDeliveryFailures
          expr: sum(increase(sso_mail_send_total{outcome="failure"}[1h])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "WeldForge email delivery is failing"
            description: >
              At least one outbound email (password reset / verification /
              identity-proofing) failed to send in the last hour. The triggering
              security operation still returned success, so users see no error —
              account recovery may be silently broken. Check SMTP / SendGrid
              (key, quota, deliverability) and docs/email-deliverability.md.

        - alert: MailDeliveryAllFailing
          expr: |
            (sum(increase(sso_mail_send_total{outcome="failure"}[30m])) > 0)
            unless (sum(increase(sso_mail_send_total{outcome="success"}[30m])) > 0)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "All WeldForge email sends are failing"
            description: >
              Every outbound email in the last 30m failed with no successes —
              SMTP is almost certainly down. Account recovery and email
              verification are broken for every tenant. Page on-call.
{{- end }}
