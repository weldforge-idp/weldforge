{{- if .Values.monitoring.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sso-alerts
  namespace: {{ .Values.global.namespace }}
  labels:
    app: sso-api
    release: prometheus
spec:
  groups:
    - name: intelli-sso
      rules:
        - alert: HighLoginFailureRate
          expr: |
            sum(rate(sso_auth_login_total{outcome="failure"}[5m])) /
            (sum(rate(sso_auth_login_total[5m])) > 0) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Login failure rate exceeds 50%"

        - alert: LoginFailureSpike
          expr: sum(rate(sso_auth_login_total{outcome="failure"}[5m])) > 10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Login failure rate exceeds 10/sec"

        - alert: HighHeapUsage
          expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "JVM heap usage above 90%"

        - alert: HighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) /
            sum(rate(http_server_requests_seconds_count[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HTTP 5xx error rate above 5%"
{{- end }}
