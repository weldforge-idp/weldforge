apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-api
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: sso-api
  template:
    metadata:
      labels:
        app: sso-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8076"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      {{- if .Values.api.serviceAccount.create }}
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      {{- end }}
      terminationGracePeriodSeconds: 45
      containers:
        - name: sso-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8076
          envFrom:
            - secretRef:
                name: sso-api-secret
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # timeoutSeconds is 5, not the 1s default: JVM boot saturates the
          # CPU limit (observed 947m of 1000m), and a throttled JVM cannot
          # always answer /actuator/health inside 1s. A 1s timeout counts
          # those as probe failures and kills a container that is merely slow.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8076
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8076
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          # failureThreshold 60 => 15s + 60*5s = 315s of startup budget.
          # Was 20 (=115s), which was LESS than this app's cold-start time on a
          # contended node. Result 2026-08-17: every replica was SIGKILLed
          # mid-boot (exit 137, "failed startup probe"), CrashLoopBackOff, and
          # sso-api.weldforge.org served 502 for ~15 min after the billing
          # outage — an outage caused purely by the probe, not the app.
          # Do not lower this without measuring actual cold-start time.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8076
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
        {{- if .Values.api.cloudsql.enabled }}
        - name: cloudsql-proxy
          image: {{ .Values.api.cloudsql.proxyImage }}
          args:
            - "--structured-logs"
            - "--port={{ .Values.api.cloudsql.port }}"
            - {{ .Values.api.cloudsql.connectionName | quote }}
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        {{- end }}
      {{- if not .Values.api.cloudsql.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z sso-postgres 5432; do echo waiting for postgres; sleep 2; done"
      {{- end }}
