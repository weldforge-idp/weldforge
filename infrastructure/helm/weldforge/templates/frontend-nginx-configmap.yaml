apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: {{ .Values.global.namespace }}
data:
  default.conf: |
    # Preserve X-Forwarded-Proto from upstream proxies (the GCP HTTPS LB
    # terminates TLS and sets X-Forwarded-Proto: https, but its hop into
    # nginx is plain http, so $scheme would clobber that to "http"). If
    # the client/upstream sent a value, pass it through; otherwise fall
    # back to nginx's view.
    map $http_x_forwarded_proto $proxy_xfp {
      default $http_x_forwarded_proto;
      ''      $scheme;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;
        gzip_min_length 256;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        location /api/ {
            proxy_pass http://sso-api:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_xfp;
            proxy_read_timeout 60s;
        }

        # Public liveness probe — proxies /health to sso-api so external
        # uptime monitors can hit the API without exposing the richer
        # actuator endpoints. Returns {"status":"UP"} from HealthController.
        location = /health {
            proxy_pass http://sso-api:8080/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_xfp;
            proxy_read_timeout 5s;
        }

        location /saml2/ {
            proxy_pass http://sso-api:8080/saml2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_xfp;
        }

        location /t/ {
            proxy_pass http://sso-api:8080/t/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_xfp;
        }

        location /scim/ {
            proxy_pass http://sso-api:8080/scim/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_xfp;
        }
    }
