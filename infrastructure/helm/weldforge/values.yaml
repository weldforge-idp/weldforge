# ============================================================
# Default values for weldforge (GKE Autopilot).
# Override per environment with values-staging.yaml, values-prod.yaml.
# ============================================================

global:
  namespace: sso

# --- API (Spring Boot backend) ---
api:
  image:
    repository: africa-south1-docker.pkg.dev/weldforge/images/weldforge-auth
    tag: "0.7.0-user-mgmt"
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  env:
    # Datasource hits the Cloud SQL Auth Proxy sidecar on localhost.
    SPRING_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:5432/weldforge"
    SPRING_DATASOURCE_USERNAME: "wfuser"
    JWT_EXPIRATION_MS: "300000"
    REFRESH_TOKEN_EXPIRATION_MS: "604800000"
    APP_KEY_ROTATION_ENABLED: "true"
    APP_KEY_ROTATION_MAX_AGE_DAYS: "90"
    SHUTDOWN_TIMEOUT: "30s"
  secrets:
    SPRING_DATASOURCE_PASSWORD: "changeme-cloud-sql-password"
    JWT_SECRET: "changeme-generate-a-256-bit-secret-key-here"
    APP_CRYPTO_SECRET: "changeme-source-from-kms-or-hsm"
  cloudsql:
    enabled: true
    connectionName: weldforge:africa-south1:weldforge-db
    proxyImage: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
    port: 5432
  serviceAccount:
    create: true
    name: sso-api
    gcpServiceAccount: sso-api@weldforge.iam.gserviceaccount.com

# --- Frontend (Angular + nginx) ---
frontend:
  image:
    repository: africa-south1-docker.pkg.dev/weldforge/images/weldforge-admin-portal
    tag: "prod-6"
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    annotations: {}
  ingress:
    enabled: true
    staticIpName: sso-frontend-ip
    managedCert:
      enabled: true
      name: sso-frontend-cert
      domains:
        - sso.weldforge.org

# --- PostgreSQL ---
# Disabled — replaced by Cloud SQL via the Auth Proxy sidecar.
postgres:
  enabled: false

# --- Monitoring ---
monitoring:
  serviceMonitor:
    enabled: false
  prometheusRules:
    enabled: false

# --- CORS ---
cors:
  allowedOrigins: "https://sso.weldforge.org,https://app.wellspring.org.za"

# --- Outbound email (SMTP / SendGrid) ---
# Dormant until mail.password is supplied. The deploy workflow sources the
# SendGrid API key from GCP Secret Manager (secret: wf-sendgrid-api-key) and
# --set-strings mail.password. With no such secret the password stays empty,
# no SPRING_MAIL_* env is rendered, SmtpMailService stays inactive, and
# LoggingMailService remains the MailService — so this is safe to deploy
# before SMTP is set up. Creating that one GCP secret is the whole activation
# step. See docs/email-deliverability.md.
mail:
  host: smtp.sendgrid.net
  port: 587
  # SendGrid SMTP: the username is the literal string "apikey"; the API key
  # itself is the password.
  username: apikey
  from: no-reply@weldforge.org
  # Injected at deploy time from Secret Manager — never commit a real key.
  password: ""
