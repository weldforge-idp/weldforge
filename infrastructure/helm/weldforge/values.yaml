# ============================================================
# Default values for weldforge (GKE Autopilot).
# Override per environment with values-staging.yaml, values-prod.yaml.
# ============================================================

global:
  namespace: sso

# --- API (Spring Boot backend) ---
api:
  image:
    repository: africa-south1-docker.pkg.dev/weldforge/images/weldforge-auth
    tag: "0.7.0-user-mgmt"
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  env:
    # Datasource hits the Cloud SQL Auth Proxy sidecar on localhost.
    SPRING_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:5432/weldforge"
    SPRING_DATASOURCE_USERNAME: "wfuser"
    JWT_EXPIRATION_MS: "300000"
    REFRESH_TOKEN_EXPIRATION_MS: "604800000"
    APP_KEY_ROTATION_ENABLED: "true"
    APP_KEY_ROTATION_MAX_AGE_DAYS: "90"
    SHUTDOWN_TIMEOUT: "30s"
    # Public base domain — drives both Host-based tenant resolution
    # (TenantResolverFilter) and outbound URL construction (password-reset
    # email link is built as https://{slug}.<base>/reset-password?token=…).
    # See docs/auth-url-spec.md.
    APP_PUBLIC_BASE_DOMAIN: "sso.weldforge.org"
    APP_PUBLIC_SCHEME:      "https"
    APP_PUBLIC_RESERVED_LABELS: "www,api,admin,app,mail,static"
    # Days a deleted tenant's slug stays unavailable for reuse — closes the
    # identity-confusion window after a tenant delete. See docs/auth-url-spec.md.
    APP_PUBLIC_SLUG_HOLDBACK_DAYS: "90"
  secrets:
    SPRING_DATASOURCE_PASSWORD: "changeme-cloud-sql-password"
    JWT_SECRET: "changeme-generate-a-256-bit-secret-key-here"
    APP_CRYPTO_SECRET: "changeme-source-from-kms-or-hsm"
  cloudsql:
    enabled: true
    connectionName: weldforge:africa-south1:weldforge-db
    proxyImage: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
    port: 5432
  serviceAccount:
    create: true
    name: sso-api
    gcpServiceAccount: sso-api@weldforge.iam.gserviceaccount.com

# --- Frontend (Angular + nginx) ---
frontend:
  image:
    repository: africa-south1-docker.pkg.dev/weldforge/images/weldforge-admin-portal
    tag: "prod-6"
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    annotations: {}
  ingress:
    enabled: true
    staticIpName: sso-frontend-ip
    # GCP ManagedCertificate cannot issue wildcards (*.host) — only leaf
    # certs. The leaf cert below stays in place for the apex
    # sso.weldforge.org. The wildcard *.sso.weldforge.org needed for the
    # per-tenant auth subdomains is provisioned out-of-band via Google
    # Certificate Manager (DNS-authorised) and attached to the ingress
    # via CertificateMap. See docs/auth-url-spec.md "TLS" section.
    managedCert:
      enabled: true
      name: sso-frontend-cert
      domains:
        - sso.weldforge.org
    # Per-tenant leaf certs for <tenant>.sso.weldforge.org. GCP ManagedCertificate
    # can't issue wildcards, so each tenant auth subdomain gets its own leaf cert,
    # attached to the sso-frontend ingress alongside the apex cert above. These
    # were previously created out-of-band; captured here so a re-apply reproduces
    # them instead of dropping them from the ingress. (The wildcard-via-Certificate-
    # Manager approach noted above remains the intended long-term replacement.)
    tenantCerts:
      - name: sso-cert-buddy-suite
        domain: buddy-suite.sso.weldforge.org
      - name: sso-cert-cwvermaak-tech
        domain: cwvermaak-tech.sso.weldforge.org
      - name: sso-cert-leap
        domain: leap.sso.weldforge.org

# --- PostgreSQL ---
# Disabled — replaced by Cloud SQL via the Auth Proxy sidecar.
postgres:
  enabled: false

# --- Monitoring ---
monitoring:
  serviceMonitor:
    enabled: false
  prometheusRules:
    enabled: false

# --- CORS ---
# Per-tenant subdomains live under *.sso.weldforge.org. The Spring CORS
# config is wildcard-aware via the * suffix, so listing the wildcard once
# covers every tenant. The apex stays explicitly listed for the admin
# portal / OIDC endpoints.
cors:
  allowedOrigins: "https://sso.weldforge.org,https://*.sso.weldforge.org,https://app.wellspring.org.za"

# --- Outbound email (SMTP / SendGrid) ---
# Dormant until mail.password is supplied. The deploy workflow sources the
# SendGrid API key from GCP Secret Manager (secret: wf-sendgrid-api-key) and
# --set-strings mail.password. With no such secret the password stays empty,
# no SPRING_MAIL_* env is rendered, SmtpMailService stays inactive, and
# LoggingMailService remains the MailService — so this is safe to deploy
# before SMTP is set up. Creating that one GCP secret is the whole activation
# step. See docs/email-deliverability.md.
mail:
  host: smtp.sendgrid.net
  port: 587
  # SendGrid SMTP: the username is the literal string "apikey"; the API key
  # itself is the password.
  username: apikey
  from: no-reply@weldforge.org
  # Injected at deploy time from Secret Manager — never commit a real key.
  password: ""
