# Production environment overrides (GKE Autopilot)
global:
  namespace: sso

api:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  env:
    APP_KEY_ROTATION_ENABLED: "true"
    APP_KEY_ROTATION_MAX_AGE_DAYS: "90"

frontend:
  replicas: 2

cors:
  allowedOrigins: "https://sso.weldforge.org,https://app.wellspring.org.za"
