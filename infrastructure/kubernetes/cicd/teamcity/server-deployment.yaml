apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamcity-server
  namespace: cicd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teamcity-server
  template:
    metadata:
      labels:
        app: teamcity-server
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /data/teamcity_server/datadir"]
          volumeMounts:
            - name: teamcity-data
              mountPath: /data/teamcity_server/datadir
      containers:
        - name: teamcity-server
          image: jetbrains/teamcity-server:latest
          ports:
            - containerPort: 8111
          env:
            - name: TEAMCITY_DB_URL
              value: "jdbc:postgresql://teamcity-postgres:5432/teamcity"
            - name: TEAMCITY_DB_USER
              valueFrom:
                secretKeyRef:
                  name: teamcity-postgres-secret
                  key: POSTGRES_USER
            - name: TEAMCITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teamcity-postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: teamcity-data
              mountPath: /data/teamcity_server/datadir
            - name: teamcity-logs
              mountPath: /opt/teamcity/logs
            - name: server-config
              mountPath: /opt/teamcity/conf/server.xml
              subPath: server.xml
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 8111
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8111
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 20
      volumes:
        - name: teamcity-data
          persistentVolumeClaim:
            claimName: teamcity-data
        - name: teamcity-logs
          emptyDir: {}
        - name: server-config
          configMap:
            name: teamcity-server-config
