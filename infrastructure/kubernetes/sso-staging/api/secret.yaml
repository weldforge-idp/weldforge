# =============================================================================
# sso-api-secret (staging) — template only.
#
# WARNING: Do NOT apply this file directly. Live values are kept in the cluster
# and are not stored in git. This file exists as a schema reference.
#
# Generating strong replacements:
#   JWT_SECRET:         openssl rand -base64 64
#   APP_CRYPTO_SECRET:  openssl rand -base64 48
#   DB password:        openssl rand -base64 32 | tr -d '/+='
#
# Staging and production must use DIFFERENT values so a staging leak cannot
# compromise production.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sso-api-secret
  namespace: sso-staging
type: Opaque
stringData:
  # Database
  SPRING_DATASOURCE_URL: "jdbc:postgresql://sso-postgres:5432/intelli_sso"
  SPRING_DATASOURCE_USERNAME: "postgres-admin"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_WITH_STRONG_VALUE"

  # JWT — MUST be >= 256 bits random, distinct from prod
  JWT_SECRET: "REPLACE_WITH_STRONG_VALUE"
  JWT_EXPIRATION_MS: "300000"
  REFRESH_TOKEN_EXPIRATION_MS: "604800000"

  # AES-GCM key for encrypting OAuth2 client secrets + signing keys
  APP_CRYPTO_SECRET: "REPLACE_WITH_STRONG_VALUE"

  # CORS
  APP_CORS_ALLOWED_ORIGINS: "https://staging-admin.weldforge.org,https://staging-sso.weldforge.org"

  # Forward header handling
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"

  # Key rotation (disabled in staging to avoid noise)
  APP_KEY_ROTATION_ENABLED: "false"

  # Graceful shutdown
  SHUTDOWN_TIMEOUT: "30s"

  # OAuth2 providers — configure via the admin portal
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  FACEBOOK_CLIENT_ID: ""
  FACEBOOK_CLIENT_SECRET: ""
  APPLE_CLIENT_ID: ""
  APPLE_CLIENT_SECRET: ""
  TWITTER_CLIENT_ID: ""
  TWITTER_CLIENT_SECRET: ""
  LINKEDIN_CLIENT_ID: ""
  LINKEDIN_CLIENT_SECRET: ""
  AMAZON_CLIENT_ID: ""
  AMAZON_CLIENT_SECRET: ""
  INSTAGRAM_CLIENT_ID: ""
  INSTAGRAM_CLIENT_SECRET: ""
  TIKTOK_CLIENT_ID: ""
  TIKTOK_CLIENT_SECRET: ""

  # Twilio SMS — per-tenant, configured via admin portal (/api/admin/tenants/{id}/twilio).
  # The global TWILIO_* env vars were removed in V18 migration.
