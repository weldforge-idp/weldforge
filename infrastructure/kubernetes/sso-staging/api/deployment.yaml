apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-api
  namespace: sso-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sso-api
  template:
    metadata:
      labels:
        app: sso-api
    spec:
      containers:
        - name: sso-api
          image: 650539477525.dkr.ecr.af-south-1.amazonaws.com/intelli-sso-auth:staging
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: sso-api-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z sso-postgres 5432; do echo waiting for postgres; sleep 2; done"
