apiVersion: v1
kind: Service
metadata:
  name: sso-frontend
  namespace: sso-staging
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:af-south-1:650539477525:certificate/4a9f0bd7-43f9-4a2c-9501-6c286c9f39e2"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: sso-frontend
  ports:
    - name: https
      port: 443
      targetPort: 80
      protocol: TCP
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
