apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-frontend
  namespace: sso
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sso-frontend
  template:
    metadata:
      labels:
        app: sso-frontend
    spec:
      containers:
        - name: sso-frontend
          image: 650539477525.dkr.ecr.af-south-1.amazonaws.com/intelli-sso-admin-portal:latest
          ports:
            - containerPort: 80
              name: https-tgt
            - containerPort: 8081
              name: http-tgt
          env:
            # Injected into the nginx template via envsubst at startup.
            # Restricts which $VAR references get substituted — nginx's
            # own $host / $remote_addr / etc. must NOT be touched.
            - name: NGINX_ENVSUBST_FILTER
              value: "^APP_API_KEY$"
            - name: APP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sso-frontend-app-key
                  key: APP_API_KEY
          volumeMounts:
            # Files under /etc/nginx/templates/*.template are processed
            # by envsubst by the nginx:alpine entrypoint and written to
            # /etc/nginx/conf.d/<basename-without-.template>. We mount
            # the ConfigMap here so the default.conf.template key lands
            # in the template directory.
            - name: nginx-config
              mountPath: /etc/nginx/templates
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
