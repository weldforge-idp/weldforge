apiVersion: v1
kind: Service
metadata:
  name: sso-frontend
  namespace: sso
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:af-south-1:650539477525:certificate/2835246d-5d22-4798-8fca-ad8ce95fff6f"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: sso-frontend
  ports:
    - name: https
      port: 443
      targetPort: 80
      protocol: TCP
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
