apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-api
  namespace: sso
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sso-api
  template:
    metadata:
      labels:
        app: sso-api
      annotations:
        # Prometheus scraping via ServiceMonitor is preferred, but
        # these annotations serve as a fallback for annotation-based
        # discovery in smaller clusters.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: sso-api
          image: 650539477525.dkr.ecr.af-south-1.amazonaws.com/intelli-sso-auth:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: sso-api-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 20
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z sso-postgres 5432; do echo waiting for postgres; sleep 2; done"
