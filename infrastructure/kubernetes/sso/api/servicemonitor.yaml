apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sso-api
  namespace: sso
  labels:
    app: sso-api
    release: prometheus
spec:
  selector:
    matchLabels:
      app: sso-api
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - sso
