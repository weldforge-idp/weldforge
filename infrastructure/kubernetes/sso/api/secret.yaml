# =============================================================================
# sso-api-secret — template only.
#
# WARNING: Do NOT apply this file directly to production. The live values are
# kept in the cluster and are not stored in git. This file exists as a schema
# reference for what keys the API expects.
#
# To rotate or update values, use:
#   kubectl patch secret sso-api-secret -n sso --type=json \
#     -p='[{"op":"replace","path":"/data/JWT_SECRET","value":"<base64>"}]'
#
# Generating strong replacements:
#   JWT_SECRET:         openssl rand -base64 64
#   APP_CRYPTO_SECRET:  openssl rand -base64 48
#   DB password:        openssl rand -base64 32 | tr -d '/+='
#
# NOTE: rotating APP_CRYPTO_SECRET invalidates any AES-GCM encrypted column in
# the DB (tenant_signing_keys.private_key_enc, oidc_clients.client_secret_enc,
# tenant_social_providers.client_secret_enc). A migration is required, or
# those rows must be purged and regenerated.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sso-api-secret
  namespace: sso
type: Opaque
stringData:
  # Database
  SPRING_DATASOURCE_URL: "jdbc:postgresql://sso-postgres:5432/intelli_sso"
  SPRING_DATASOURCE_USERNAME: "postgres-admin"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_WITH_STRONG_VALUE"

  # JWT — MUST be >= 256 bits random
  JWT_SECRET: "REPLACE_WITH_STRONG_VALUE"
  JWT_EXPIRATION_MS: "300000"
  REFRESH_TOKEN_EXPIRATION_MS: "604800000"

  # AES-GCM key for encrypting OAuth2 client secrets + signing keys
  APP_CRYPTO_SECRET: "REPLACE_WITH_STRONG_VALUE"

  # CORS
  APP_CORS_ALLOWED_ORIGINS: "https://admin.weldforge.org,https://sso.weldforge.org"

  # Forward header handling (Spring Boot honors X-Forwarded-* from the LB)
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"

  # Key rotation (opt-in)
  APP_KEY_ROTATION_ENABLED: "true"
  APP_KEY_ROTATION_MAX_AGE_DAYS: "90"

  # Graceful shutdown
  SHUTDOWN_TIMEOUT: "30s"

  # OAuth2 providers — configure via the admin portal, not env vars
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  FACEBOOK_CLIENT_ID: ""
  FACEBOOK_CLIENT_SECRET: ""
  APPLE_CLIENT_ID: ""
  APPLE_CLIENT_SECRET: ""
  TWITTER_CLIENT_ID: ""
  TWITTER_CLIENT_SECRET: ""
  LINKEDIN_CLIENT_ID: ""
  LINKEDIN_CLIENT_SECRET: ""
  AMAZON_CLIENT_ID: ""
  AMAZON_CLIENT_SECRET: ""
  INSTAGRAM_CLIENT_ID: ""
  INSTAGRAM_CLIENT_SECRET: ""
  TIKTOK_CLIENT_ID: ""
  TIKTOK_CLIENT_SECRET: ""

  # Twilio SMS (for future SMS MFA)
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_PHONE_NUMBER: ""
