app:
  jwt:
    secret: ${JWT_SECRET:2dqSJTLVG5z0Im0APLXYgj9QB19HVfYSfGJnEbXRM8vp+93tw7sRn3+f9JvcUkA2dL0x6sbEEWOqf0IEzEsUBA==}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:300000} # 5 minutes
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
  crypto:
    # Used to derive the AES-GCM key that encrypts per-tenant OAuth2 client
    # secrets at rest. MUST be set to a strong random value in production
    # and sourced from a KMS / HSM (see PRD SEC-09).
    secret: ${APP_CRYPTO_SECRET:dev-only-change-me-weldforge-tenant-secret-key}
  security:
    password:
      min-length:        ${APP_PASSWORD_MIN_LENGTH:10}
      max-length:        ${APP_PASSWORD_MAX_LENGTH:72}
      require-uppercase: ${APP_PASSWORD_REQUIRE_UPPERCASE:true}
      require-lowercase: ${APP_PASSWORD_REQUIRE_LOWERCASE:true}
      require-digit:     ${APP_PASSWORD_REQUIRE_DIGIT:true}
      require-symbol:    ${APP_PASSWORD_REQUIRE_SYMBOL:true}
    lockout:
      max-attempts: ${APP_LOCKOUT_MAX_ATTEMPTS:5}
      lock-minutes: ${APP_LOCKOUT_MINUTES:15}
    rate-limit:
      enabled:                 ${APP_RATE_LIMIT_ENABLED:true}
      login-capacity:          ${APP_RATE_LIMIT_LOGIN_CAPACITY:10}
      login-refill-minutes:    ${APP_RATE_LIMIT_LOGIN_REFILL_MINUTES:15}
      mfa-verify-capacity:     ${APP_RATE_LIMIT_MFA_CAPACITY:15}
      mfa-verify-refill-minutes: ${APP_RATE_LIMIT_MFA_REFILL_MINUTES:15}
      register-capacity:       ${APP_RATE_LIMIT_REGISTER_CAPACITY:5}
      register-refill-minutes: ${APP_RATE_LIMIT_REGISTER_REFILL_MINUTES:60}
    refresh-token:
      lifetime-days: ${APP_REFRESH_TOKEN_LIFETIME_DAYS:30}
  mfa:
    totp:
      issuer: ${APP_MFA_TOTP_ISSUER:WeldForge}
    webauthn:
      # The RP id must match the domain the browser sees at the time of the
      # ceremony. Use the bare host, no scheme, no port.
      rp-id:   ${APP_MFA_WEBAUTHN_RP_ID:localhost}
      rp-name: ${APP_MFA_WEBAUTHN_RP_NAME:WeldForge}
      # Comma-separated list of origins the library will accept.
      origins: ${APP_MFA_WEBAUTHN_ORIGINS:http://localhost:4200,http://localhost:8080}

  key-rotation:
    enabled: ${APP_KEY_ROTATION_ENABLED:false}
    interval-ms: ${APP_KEY_ROTATION_INTERVAL_MS:86400000}
    max-age-days: ${APP_KEY_ROTATION_MAX_AGE_DAYS:90}
  scim:
    bulk:
      max-operations: ${APP_SCIM_BULK_MAX_OPERATIONS:100}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# NOTE: Twilio credentials are now configured per-tenant via the admin
# portal and stored in tenant_twilio_providers (AES-GCM encrypted at rest).
# The global TWILIO_* environment variables were removed in V18.

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: db,diskSpace
  prometheus:
    metrics:
      export:
        enabled: true
