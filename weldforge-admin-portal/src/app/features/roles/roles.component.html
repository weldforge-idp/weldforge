<mat-card>
  <mat-card-header>
    <mat-card-title>Roles Management</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <!-- Form -->
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput [(ngModel)]="newRole().name" required>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <input matInput [(ngModel)]="newRole().description">
      </mat-form-field>

      <button mat-raised-button color="primary"
              [disabled]="createMutation.isPending() || !newRole().name?.trim()"
              (click)="addRole()">
        {{ createMutation.isPending() ? 'Creating...' : 'Add Role' }}
      </button>
    </div>

    <!-- Table / Loading -->
    @if (rolesQuery.isLoading()) {
      <mat-spinner diameter="48"></mat-spinner>
    } @else if (rolesQuery.data(); as roles) {
      <table mat-table [dataSource]="roles" class="mat-elevation-z4">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let role">{{ role.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let role">{{ role.description || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let role">
            <!-- Add edit/delete buttons later -->
            <button mat-icon-button color="warn">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    } @else {
      <p>No roles found.</p>
    }
  </mat-card-content>
</mat-card>
