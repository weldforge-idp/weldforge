server:
  port: 8080
  shutdown: graceful
  # Honour X-Forwarded-* from the GCP HTTPS load balancer (and any other
  # TLS-terminating proxy) so generated absolute URLs — OIDC issuer,
  # authorize/token endpoints, redirect URIs — carry the original https
  # scheme and host instead of the LB-internal http://podname.
  # `native` configures Tomcat's RemoteIpValve, which mutates
  # request.getScheme() at the connector level so request.getScheme()
  # returns "https" everywhere (Spring's `framework` filter wraps later
  # in the chain and didn't reach the controller's request param).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      # Trust every upstream — the GKE Ingress chain hops through Google's
      # GFE then a NEG before hitting us, and the source IP is internal RFC1918.
      internal-proxies: ".*"

spring:
  application:
    name: weldforge-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/weldforge}
    username: ${SPRING_DATASOURCE_USERNAME:weldforge}
    password: ${SPRING_DATASOURCE_PASSWORD:weldforge123}
  jpa:
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  flyway:
    enabled: true
    baseline-on-migrate: true
    fail-on-missing-locations: true
    # Allow Flyway to work with newer PostgreSQL versions (like 18)
    postgresql:
      transactional-lock: false

