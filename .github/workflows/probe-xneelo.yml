name: probe-xneelo

# Throwaway diagnostic: from a GitHub-hosted runner, TCP-probe the Xneelo
# host (weldforge.org) on the FTP and SSH/SFTP ports. The marketing-site
# FTP deploy (deploy-www.yml) started timing out on port 21 from GitHub
# runners around 2026-06-05..12 while still working from the SA network.
# This tells us whether the block is FTP-port-specific (→ switch to SFTP)
# or whole-host (→ self-hosted runner). Delete once answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: TCP reachability probe
        env:
          WWW_FTP_HOST: ${{ secrets.WWW_FTP_HOST }}
        run: |
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo "Resolving weldforge.org:"; getent hosts weldforge.org || true
          probe() {
            local host=$1 port=$2 t0 t1
            t0=$(date +%s)
            if timeout 15 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
              echo "OPEN     $host:$port"
            else
              t1=$(date +%s)
              echo "BLOCKED  $host:$port  (gave up after $((t1-t0))s)"
            fi
          }
          echo "--- control sanity (expect OPEN) ---"
          probe github.com 443
          echo "--- Xneelo host weldforge.org ---"
          probe weldforge.org 21
          probe weldforge.org 22
          probe weldforge.org 2222
          probe weldforge.org 443
          echo "--- configured deploy host (WWW_FTP_HOST secret; value masked) ---"
          if [ -z "$WWW_FTP_HOST" ]; then
            echo "WWW_FTP_HOST is EMPTY/unset"
          else
            if [ "$WWW_FTP_HOST" = "weldforge.org" ]; then
              echo "secret host == weldforge.org (SAME as the working local push)"
            else
              echo "secret host != weldforge.org (DIFFERENT from the working local push)"
            fi
            probe "$WWW_FTP_HOST" 21
            probe "$WWW_FTP_HOST" 22
          fi
