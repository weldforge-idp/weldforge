name: deploy-gcp

# Builds weldforge-auth + weldforge-admin-portal images, pushes to GCP
# Artifact Registry, then Helm-upgrades the GKE Autopilot release.
#
# ─────────────────────────────────────────────────────────────────────────────
# DORMANT as of 2026-08-16 — the GCP environment is no longer running.
#
# The automatic push trigger is removed. Every run since 2026-06-05 has failed
# at the first step, "Build & push backend image":
#
#     denied: This API method requires billing to be enabled.
#     Please enable billing on project #42633983307
#
# The failure went unnoticed for two months because nothing touched the deploy
# paths in that window; merging #73 was the first push to trigger it, and #75
# failed identically. Left on the push trigger, every merge to main would now
# fail a required-looking check for a target that no longer exists.
#
# The workflow is kept rather than deleted: it documents the working GCP
# topology (Artifact Registry + GKE Autopilot + Workload Identity Federation)
# and is the starting point if the estate is rebuilt or ported.
#
# Secrets no longer come from GCP Secret Manager — they are SOPS+age encrypted
# in infrastructure/secrets/ and decrypted at deploy time with SOPS_AGE_KEY.
# That part is portable: it will work unchanged against any Kubernetes cluster,
# so only the image-registry and cluster-credential steps are GCP-specific.
#
# workflow_dispatch is retained deliberately, so it can still be run by hand
# without editing this file. It will keep failing until billing is restored.
#
# NOTE: merges to main no longer deploy anything. Anything merged while this is
# dormant is on main but NOT running anywhere.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

env:
  REGION: africa-south1
  AR_HOST: africa-south1-docker.pkg.dev
  GCP_PROJECT: weldforge
  AR_BACKEND: weldforge/images/weldforge-auth
  AR_FRONTEND: weldforge/images/weldforge-admin-portal
  GKE_CLUSTER: weldforge-gke
  K8S_NAMESPACE: sso
  HELM_RELEASE: weldforge
  WIF_PROVIDER: projects/42633983307/locations/global/workloadIdentityPools/github-actions/providers/github-actions
  # Opt JS actions into the Node.js 24 runtime ahead of GitHub's 2026-09-16
  # forced removal of Node 20 (default flip is 2026-06-16). Surfaces any
  # action-side incompatibilities in CI before they bite a production deploy.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WIF_SA: gha-deployer@weldforge.iam.gserviceaccount.com

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=$(echo ${{ github.sha }} | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for AR
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: weldforge-auth
          push: true
          tags: |
            ${{ env.AR_HOST }}/${{ env.AR_BACKEND }}:${{ steps.tag.outputs.value }}
            ${{ env.AR_HOST }}/${{ env.AR_BACKEND }}:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: weldforge-admin-portal
          push: true
          tags: |
            ${{ env.AR_HOST }}/${{ env.AR_FRONTEND }}:${{ steps.tag.outputs.value }}
            ${{ env.AR_HOST }}/${{ env.AR_FRONTEND }}:latest

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Install SOPS
        run: |
          curl -fsSL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.12.0/sops-v3.12.0.linux.amd64
          chmod +x /usr/local/bin/sops
          sops --version

      # Secrets come from infrastructure/secrets/prod.enc.yaml, encrypted with
      # SOPS + age and committed to the repo. This replaces the previous
      # "read from GCP Secret Manager" step, which died with the GCP estate and
      # was never available to self-hosters anyway.
      #
      # The decrypted overlay is written to a mktemp path (mode 600) and removed
      # by the trap on EXIT, so a failed deploy cannot leave plaintext on the
      # runner. Values are never echoed and never pass through step outputs —
      # they go straight from the file into `helm -f`, so nothing lands in the
      # workflow log even without masking.
      - name: Helm upgrade
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "${SOPS_AGE_KEY:-}" ]; then
            echo "::error::SOPS_AGE_KEY is not set. Add the age private key as a repository secret."
            exit 1
          fi
          OVERLAY=$(mktemp /tmp/wf-secrets-XXXXXX.yaml)
          chmod 600 "$OVERLAY"
          trap 'shred -u "$OVERLAY" 2>/dev/null || rm -f "$OVERLAY"' EXIT
          sops --decrypt infrastructure/secrets/prod.enc.yaml > "$OVERLAY"

          helm upgrade --install ${{ env.HELM_RELEASE }} infrastructure/helm/weldforge \
            --namespace ${{ env.K8S_NAMESPACE }} --create-namespace \
            -f infrastructure/helm/weldforge/values-prod.yaml \
            -f "$OVERLAY" \
            --set api.image.repository=${{ env.AR_HOST }}/${{ env.AR_BACKEND }} \
            --set api.image.tag=${{ steps.tag.outputs.value }} \
            --set frontend.image.repository=${{ env.AR_HOST }}/${{ env.AR_FRONTEND }} \
            --set frontend.image.tag=${{ steps.tag.outputs.value }} \
            --wait --timeout=10m
