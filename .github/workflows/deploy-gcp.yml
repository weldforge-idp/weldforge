name: deploy-gcp

# Builds weldforge-auth + weldforge-admin-portal images, pushes to GCP
# Artifact Registry, then Helm-upgrades the GKE Autopilot release.

on:
  push:
    branches: [main]
    paths:
      - 'weldforge-auth/**'
      - 'weldforge-admin-portal/**'
      - 'infrastructure/helm/weldforge/**'
      - '.github/workflows/deploy-gcp.yml'
  workflow_dispatch:

env:
  REGION: africa-south1
  AR_HOST: africa-south1-docker.pkg.dev
  GCP_PROJECT: weldforge
  AR_BACKEND: weldforge/images/weldforge-auth
  AR_FRONTEND: weldforge/images/weldforge-admin-portal
  GKE_CLUSTER: weldforge-gke
  K8S_NAMESPACE: sso
  HELM_RELEASE: weldforge
  WIF_PROVIDER: projects/42633983307/locations/global/workloadIdentityPools/github-actions/providers/github-actions
  WIF_SA: gha-deployer@weldforge.iam.gserviceaccount.com

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=$(echo ${{ github.sha }} | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for AR
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: weldforge-auth
          push: true
          tags: |
            ${{ env.AR_HOST }}/${{ env.AR_BACKEND }}:${{ steps.tag.outputs.value }}
            ${{ env.AR_HOST }}/${{ env.AR_BACKEND }}:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: weldforge-admin-portal
          push: true
          tags: |
            ${{ env.AR_HOST }}/${{ env.AR_FRONTEND }}:${{ steps.tag.outputs.value }}
            ${{ env.AR_HOST }}/${{ env.AR_FRONTEND }}:latest

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Read sensitive values from Secret Manager
        id: sm
        run: |
          echo "::add-mask::$(gcloud secrets versions access latest --secret=wf-db-password)"
          echo "::add-mask::$(gcloud secrets versions access latest --secret=wf-jwt-secret)"
          echo "::add-mask::$(gcloud secrets versions access latest --secret=wf-app-crypto-secret)"
          {
            echo "DB_PASSWORD<<EOF"
            gcloud secrets versions access latest --secret=wf-db-password
            echo
            echo "EOF"
            echo "JWT_SECRET<<EOF"
            gcloud secrets versions access latest --secret=wf-jwt-secret
            echo
            echo "EOF"
            echo "APP_CRYPTO_SECRET<<EOF"
            gcloud secrets versions access latest --secret=wf-app-crypto-secret
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Helm upgrade
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} infrastructure/helm/weldforge \
            --namespace ${{ env.K8S_NAMESPACE }} --create-namespace \
            -f infrastructure/helm/weldforge/values-prod.yaml \
            --set api.image.repository=${{ env.AR_HOST }}/${{ env.AR_BACKEND }} \
            --set api.image.tag=${{ steps.tag.outputs.value }} \
            --set frontend.image.repository=${{ env.AR_HOST }}/${{ env.AR_FRONTEND }} \
            --set frontend.image.tag=${{ steps.tag.outputs.value }} \
            --set-string api.secrets.SPRING_DATASOURCE_PASSWORD="${{ steps.sm.outputs.DB_PASSWORD }}" \
            --set-string api.secrets.JWT_SECRET="${{ steps.sm.outputs.JWT_SECRET }}" \
            --set-string api.secrets.APP_CRYPTO_SECRET="${{ steps.sm.outputs.APP_CRYPTO_SECRET }}" \
            --wait --timeout=10m
